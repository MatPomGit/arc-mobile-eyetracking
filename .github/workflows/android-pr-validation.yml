name: Android PR isolated validation
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/android*.yml'
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradlew'
      - 'gradle.properties'
permissions:
  contents: read
jobs:
  exact-head:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify exact HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-36.1'
      - name: Verify installed SDK
        run: |
          set -euo pipefail
          test -f "${ANDROID_HOME}/platforms/android-36.1/android.jar"
          cat "${ANDROID_HOME}/platforms/android-36.1/source.properties"
          jar tf "${ANDROID_HOME}/platforms/android-36.1/android.jar" > /dev/null
      - name: Compile and run unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug testDebugUnitTest
      - name: Upload unit test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-unit-results
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
