name: Android research scaffold

on:
  # Heavy build reserved for approved local Andromeda execution or
  # manually authorized one-off when provider budget is available.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Run local unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
