name: Android research scaffold

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gaze-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Install Android SDK 36.1 required by compileSdk
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-36.1'
      - name: Verify Android SDK 36.1 is installed
        shell: bash
        run: |
          set -euo pipefail
          test -f "${ANDROID_HOME}/platforms/android-36.1/android.jar"
          cat "${ANDROID_HOME}/platforms/android-36.1/source.properties"
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Run local unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
