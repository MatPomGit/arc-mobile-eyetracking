name: Android input checks (homeserver)

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/android-source-local.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gaze-android-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: [self-hosted, Linux, ARM64, homeserver]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Ensure Android source exists and XML files parse without emulator
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          assert Path("settings.gradle.kts").is_file()
          manifests = list(Path("app").rglob("AndroidManifest.xml"))
          if not manifests:
              raise SystemExit("No AndroidManifest.xml found")
          for p in manifests:
              ElementTree.parse(p)
          print(f"Validated {len(manifests)} manifests")
          PY
